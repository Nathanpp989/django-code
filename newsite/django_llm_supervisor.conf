# =============================================================================
# Supervisor configuration for Django LLM
# Manages Gunicorn, Uvicorn (FastAPI) and Ollama
#
# Setup:
#   sudo apt-get install -y supervisor
#   sudo cp django_llm_supervisor.conf /etc/supervisor/conf.d/django_llm.conf
#   sudo supervisorctl reread && sudo supervisorctl update
#   sudo supervisorctl start all
# =============================================================================

[program:gunicorn]
command=python -m gunicorn --workers 3 --timeout 120 --bind 127.0.0.1:8000 --log-level info newsite.wsgi:application
directory=/workspaces/Django_code/newDjango
user=codespace
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/gunicorn.err.log
stdout_logfile=/var/log/gunicorn.out.log
stderr_logfile_maxbytes=10MB
stdout_logfile_maxbytes=10MB
environment=DJANGO_SETTINGS_MODULE="newsite.settings"

[program:uvicorn]
command=uvicorn fastapi_app.main:app --host 127.0.0.1 --port 8001 --workers 2 --log-level info
directory=/workspaces/Django_code/newDjango
user=codespace
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/uvicorn.err.log
stdout_logfile=/var/log/uvicorn.out.log
stderr_logfile_maxbytes=10MB
stdout_logfile_maxbytes=10MB
environment=DJANGO_SETTINGS_MODULE="newsite.settings"

[program:ollama]
command=ollama serve
user=codespace
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/ollama.err.log
stdout_logfile=/var/log/ollama.out.log
stderr_logfile_maxbytes=10MB
stdout_logfile_maxbytes=10MB

[group:django_llm]
programs=gunicorn,uvicorn,ollama
