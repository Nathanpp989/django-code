# =============================================================================
# NGINX Configuration for Django LLM
# Supports:
#   - HTTPS with server-side SSL certificate
#   - Mutual TLS (mTLS) with client certificate verification
#   - HTTP to HTTPS redirect
#   - Static and media file serving
#   - Gunicorn proxy with LLM-friendly timeouts
#   - Ollama internal proxy
#   - Security headers
#
# Setup:
#   1. Run: chmod +x generate_certs.sh && ./generate_certs.sh
#   2. Copy to: sudo cp nginx.conf /etc/nginx/sites-available/django_llm
#   3. Enable: sudo ln -s /etc/nginx/sites-available/django_llm /etc/nginx/sites-enabled/
#   4. Remove default: sudo rm -f /etc/nginx/sites-enabled/default
#   5. Test: sudo nginx -t
#   6. Start: sudo service nginx restart
# =============================================================================

upstream django_gunicorn {
    server 127.0.0.1:8000 fail_timeout=0;
}

upstream ollama_server {
    server 127.0.0.1:11434 fail_timeout=0;
}

# -------------------------
# HTTP Server
# Redirects all HTTP traffic to HTTPS
# Also handles Let's Encrypt certificate renewal
# -------------------------
server {
    listen 80;
    listen [::]:80;
    server_name localhost 127.0.0.1;

    # Let's Encrypt renewal (production only)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# -------------------------
# Public HTTPS Server
# Standard HTTPS with server certificate only
# Used for public-facing pages like login
# -------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name localhost 127.0.0.1;

    # -------------------------
    # Server-Side SSL Certificate
    # Generated by generate_certs.sh or Let's Encrypt
    # -------------------------
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # -------------------------
    # SSL Settings
    # -------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling (production only - comment out for local dev)
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/nginx/ssl/ca.crt;

    # -------------------------
    # Security Headers
    # -------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # -------------------------
    # Logging
    # -------------------------
    access_log /var/log/nginx/django_llm_access.log;
    error_log /var/log/nginx/django_llm_error.log warn;

    # -------------------------
    # File Upload Limits
    # -------------------------
    client_max_body_size 10M;

    # -------------------------
    # Static Files
    # Served directly by NGINX
    # Run python manage.py collectstatic first
    # -------------------------
    location /static/ {
        alias /workspaces/Django_code/newDjango/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # -------------------------
    # Media Files
    # -------------------------
    location /media/ {
        alias /workspaces/Django_code/newDjango/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # -------------------------
    # Favicon and robots
    # -------------------------
    location = /favicon.ico {
        alias /workspaces/Django_code/newDjango/staticfiles/favicon.ico;
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        alias /workspaces/Django_code/newDjango/staticfiles/robots.txt;
        access_log off;
        log_not_found off;
    }

    # -------------------------
    # Public routes
    # Login and home page - no client cert required
    # -------------------------
    location ~* ^/(accounts/login|$) {
        proxy_pass http://django_gunicorn;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        proxy_redirect off;
    }

    # -------------------------
    # Redirect authenticated routes to mTLS port
    # Forces client cert verification for protected pages
    # -------------------------
    location / {
        return 301 https://$host:8443$request_uri;
    }

    # -------------------------
    # Block sensitive files
    # -------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|git|sql|bak|log)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# -------------------------
# Mutual TLS (mTLS) HTTPS Server
# Requires both server AND client certificates
# All protected Django routes go through here
# -------------------------
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name localhost 127.0.0.1;

    # -------------------------
    # Server-Side Certificate
    # -------------------------
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # -------------------------
    # Client Certificate Verification
    # This is the mTLS part - clients must present a valid certificate
    # signed by our CA to access this server block
    # -------------------------
    ssl_client_certificate /etc/nginx/ssl/ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;

    # -------------------------
    # SSL Settings (same as public server)
    # -------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # -------------------------
    # Security Headers
    # -------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Pass client certificate info to Django
    # These headers let Django know who the client is
    add_header X-SSL-Client-Verify $ssl_client_verify always;
    add_header X-SSL-Client-DN $ssl_client_s_dn always;

    # -------------------------
    # Logging
    # Separate log for mTLS access for auditing
    # -------------------------
    access_log /var/log/nginx/django_llm_mtls_access.log;
    error_log /var/log/nginx/django_llm_mtls_error.log warn;

    # -------------------------
    # File Upload Limits
    # -------------------------
    client_max_body_size 10M;

    # -------------------------
    # Static Files
    # -------------------------
    location /static/ {
        alias /workspaces/Django_code/newDjango/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location /media/ {
        alias /workspaces/Django_code/newDjango/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # -------------------------
    # Ollama API
    # Only accessible with valid client certificate
    # -------------------------
    location /ollama/ {
        proxy_pass http://ollama_server/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Pass client cert info to Ollama
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;

        # Long timeout for LLM responses
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }

    # -------------------------
    # Django Application
    # All requests here require a valid client certificate
    # -------------------------
    location / {
        proxy_pass http://django_gunicorn;

        # Standard proxy headers
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass client certificate info to Django
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;

        # LLM-friendly timeouts
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;

        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
        proxy_redirect off;
    }

    # -------------------------
    # Block sensitive files
    # -------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|git|sql|bak|log)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
