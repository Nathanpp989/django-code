# =============================================================================
# NGINX Configuration for Django LLM
# Fully integrated with Gunicorn, Ollama, static files and mTLS
#
# Setup:
#   1. sudo apt-get install -y nginx
#   2. chmod +x generate_certs.sh && ./generate_certs.sh
#   3. sudo cp nginx.conf /etc/nginx/sites-available/django_llm
#   4. sudo ln -s /etc/nginx/sites-available/django_llm /etc/nginx/sites-enabled/
#   5. sudo rm -f /etc/nginx/sites-enabled/default
#   6. python manage.py collectstatic
#   7. sudo nginx -t
#   8. sudo service nginx restart
# =============================================================================

upstream django_gunicorn {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

upstream ollama_server {
    server 127.0.0.1:11434 fail_timeout=0;
}

# -------------------------
# HTTP - redirect to HTTPS
# -------------------------
server {
    listen 80;
    listen [::]:80;
    server_name localhost 127.0.0.1;

    # Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -------------------------
# Public HTTPS server
# No client cert required
# Handles login and static files
# -------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name localhost 127.0.0.1;

    # Server certificate
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/django_llm_access.log;
    error_log /var/log/nginx/django_llm_error.log warn;

    client_max_body_size 10M;

    # Static files
    location /static/ {
        alias /workspaces/Django_code/newDjango/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
    }

    # Media files
    location /media/ {
        alias /workspaces/Django_code/newDjango/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location = /favicon.ico {
        alias /workspaces/Django_code/newDjango/staticfiles/favicon.ico;
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        alias /workspaces/Django_code/newDjango/staticfiles/robots.txt;
        access_log off;
        log_not_found off;
    }

    # Public routes - no client cert needed
    location ~* ^/(accounts/login|accounts/logout|admin/login|$) {
        proxy_pass http://django_gunicorn;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # All other routes redirect to mTLS port
    location / {
        return 301 https://$host:8443$request_uri;
    }

    # Block sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|git|sql|bak|log)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# -------------------------
# mTLS HTTPS server
# Requires client certificate
# All protected Django routes
# -------------------------
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name localhost 127.0.0.1;

    # Server certificate
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # Client certificate verification
    ssl_client_certificate /etc/nginx/ssl/ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Pass client cert info to Django
    add_header X-SSL-Client-Verify $ssl_client_verify always;
    add_header X-SSL-Client-DN $ssl_client_s_dn always;

    # Logging - separate log for mTLS audit trail
    access_log /var/log/nginx/django_llm_mtls_access.log;
    error_log /var/log/nginx/django_llm_mtls_error.log warn;

    client_max_body_size 10M;

    # Static files
    location /static/ {
        alias /workspaces/Django_code/newDjango/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
    }

    location /media/ {
        alias /workspaces/Django_code/newDjango/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Ollama API - only accessible with valid client cert
    location /ollama/ {
        proxy_pass http://ollama_server/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }

    # Chat endpoint - longer timeout for LLM responses
    location /chat/message/ {
        proxy_pass http://django_gunicorn;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;

        # Extra long timeout for LLM chat responses
        proxy_read_timeout 600s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 600s;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # All other Django routes
    location / {
        proxy_pass http://django_gunicorn;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Block sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|git|sql|bak|log)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
