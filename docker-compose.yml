version: "3.9"

services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      FASTAPI_DOCKER_HOST: unix:///var/run/docker.sock
      FASTAPI_DOCS_URL: /api/docs
      FASTAPI_REDOC_URL: /api/redoc
      FASTAPI_OPENAPI_URL: /api/openapi.json
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8001:8001"